name: CI

on:
  push:
    branches: [main, "hardening/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package source for engineering verification
        run: tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/breathewise-source.tar.gz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: breathewise-source
          path: /tmp/breathewise-source.tar.gz
          retention-days: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        run: npm run lint
      - name: Unit and API tests
        run: npm test
      - name: Production build
        run: npm run build
