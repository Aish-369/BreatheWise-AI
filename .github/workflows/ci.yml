name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Playwright test tooling without changing the application lockfile
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check formatting
        run: |
          npx prettier --check docs/EVALUATOR_EVIDENCE.md docs/QUALITY_AUDIT.md
          npm run format:check
      - name: Lint (ESLint, zero warnings)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit, accessibility, and API tests with coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser-level core user journeys
        run: npx playwright test
